{{- if and .Values.dryRun.enabled (eq .Values.dryRun.filterMode "schedulerName") }}
---
# The webhook exists only to hand pods that opted in via schedulerName back to
# the default scheduler. Namespace filter mode watches pods through the
# completion controller instead and installs no webhook at all.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: compute-gardener-dryrun
  {{- if .Values.dryRun.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/compute-gardener-dryrun-webhook-cert
  {{- end }}
webhooks:
- name: dryrun.compute-gardener-scheduler.kubernetes.io
  admissionReviewVersions: ["v1"]
  clientConfig:
    service:
      name: compute-gardener-dryrun-webhook
      namespace: {{ .Release.Namespace }}
      path: /mutate
    {{- if not .Values.dryRun.webhook.certManager.enabled }}
    caBundle: {{ .Values.dryRun.webhook.tls.crt | b64enc }}
    {{- end }}
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: "Namespaced"
  # The only field this webhook writes is spec.schedulerName
  sideEffects: None
  # Dry-run is an observation feature and must never block pod creation
  failurePolicy: Ignore
  timeoutSeconds: {{ .Values.dryRun.webhook.timeoutSeconds | default 10 }}
  # Evaluated by the apiserver before the webhook is called, so pods that did
  # not opt in never reach it
  matchConditions:
  - name: targets-compute-gardener
    expression: "object.spec.schedulerName == 'compute-gardener-scheduler'"
{{- end }}
